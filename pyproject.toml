[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aitecommander"
version = "1.0.0"
description = "Hierarchical bookmark and link manager with 4-level organization, 6 themes, 6 languages, and full import/export support"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Codebdbd" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Utilities",
    "Typo :: Desktop Environment",
]
dependencies = [
    "beautifulsoup4==4.14.3",
    "cachetools==6.2.5",
    "certifi==2026.1.4",
    "charset-normalizer==3.4.4",
    "cloudscraper==1.2.71",
    "filelock==3.19.1",
    "idna==3.11",
    "pillow==12.1.0",
    "pyparsing==3.3.2",
    "pyqt6==6.10.1",
    "pyqt6-qt6==6.10.1",
    "pyqt6-sip==13.11.0",
    "pywin32==311",
    "requests==2.32.5",
    "requests-toolbelt==1.0.0",
    "soupsieve==2.8.3",
    "typing-extensions==4.15.0",
    "urllib3==2.6.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.0",
    "pyinstaller>=6.0",
]

[project.gui-scripts]
aitecommander = "app.main:main"

[project.urls]
Homepage = "https://github.com/codebdbd/aitecommander"
Repository = "https://github.com/codebdbd/aitecommander"
Issues = "https://github.com/codebdbd/aitecommander/issues"
