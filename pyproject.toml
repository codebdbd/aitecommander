[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aitecommander"
version = "1.1.8"
description = "Hierarchical bookmark and link manager with 4-level organization, 17 themes, 6 languages, and full import/export support"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Codebdbd" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Utilities",
    "Topic :: Desktop Environment",
]
dependencies = [
    "beautifulsoup4==4.14.3",
    "cachetools==6.2.5",
    "certifi==2026.1.4",
    "charset-normalizer==3.4.4",
    "cloudscraper==1.2.71",
    "filelock==3.19.1",
    "idna==3.11",
    "pillow==12.3.0",
    "pyparsing==3.3.2",
    "pyqt6==6.10.1",
    "pyqt6-qt6==6.10.1",
    "pyqt6-sip==13.11.0",
    "pywin32==311",
    "requests==2.32.5",
    "requests-toolbelt==1.0.0",
    "soupsieve==2.8.3",
    "typing-extensions==4.15.0",
    "urllib3==2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.0",
    "pyinstaller>=6.0",
]

[project.gui-scripts]
aitecommander = "app.main:main"

[project.urls]
Homepage = "https://github.com/codebdbd/aitecommander"
Repository = "https://github.com/codebdbd/aitecommander"
Issues = "https://github.com/codebdbd/aitecommander/issues"

[tool.hatch.build.targets.wheel]
packages = ["app", "i18n"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    "app/resources/app_resources_rc.py",
    "i18n/resources_rc.py",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
]
ignore = [
    "E501",   # Line length handled by formatter
    "W291",   # Trailing whitespace handled by formatter
    "W293",   # Blank line whitespace handled by formatter
    "E402",   # Module level import not at top of file (bootstrap / sys.path setup)
    "BLE001", # Blind-except (Qt GUI event loop failure containment)
    "S110",   # try-except-pass (cleanup / fallback suppression)
    "S112",   # try-except-continue
    "UP045",  # non-pep604-annotation-optional (allow typing.Optional)
]

[tool.ruff.lint.per-file-ignores]
"_run_build.py" = ["F401"]

