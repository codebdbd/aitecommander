[mypy]
follow_imports = skip
python_version = 3.13
warn_unused_ignores = True
warn_redundant_casts = True
warn_unreachable = True
strict_optional = True
no_implicit_optional = True
show_error_codes = True
pretty = True

# Этапное внедрение строгих правил: начинаем с ключевых модулей

[mypy-app.controllers.system.*]
follow_imports = normal
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-app.controllers.business.*]
follow_imports = normal
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-app.services.uow]
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-app.services.*]
follow_imports = normal
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-app.utils.db.*]
follow_imports = normal
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-app.models.database.*]
follow_imports = normal
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-app.models.*]
follow_imports = normal
disallow_untyped_defs = True
check_untyped_defs = True

# Qt и сторонние пакеты могут быть без типингов
[mypy-PyQt6.*]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True
