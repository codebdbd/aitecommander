[mypy]
python_version = 3.13
warn_unused_ignores = False
warn_redundant_casts = True
warn_unreachable = False
strict_optional = True
no_implicit_optional = True
show_error_codes = True
pretty = True

# Temporarily disable strict checks for gradual refactoring
# Can be re-enabled after fixing critical errors

# [mypy-app.models.*]
# disallow_untyped_defs = True
# check_untyped_defs = True

# [mypy-app.controllers.system.*]
# disallow_untyped_defs = True
# check_untyped_defs = True

# [mypy-app.services.uow]
# disallow_untyped_defs = True
# check_untyped_defs = True

# Ignore problematic modules until refactoring
[mypy-app.controllers.system.window_setup.*]
ignore_errors = True

[mypy-app.views.main_components.initialization.*]
ignore_errors = True

[mypy-app.startup.*]
ignore_errors = True

[mypy-app.views.windows.dialogs.link_dialog.*]
ignore_errors = True

# Qt and third-party packages may lack type stubs
[mypy-PyQt6.*]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True

# Ignore Qt-heavy modules with union-attr issues
[mypy-app.views.main_components.ui.topbar.*]
ignore_errors = True

[mypy-app.utils.ui.qt.*]
ignore_errors = True

[mypy-sip]
ignore_missing_imports = True
